name: Deploy to GitHub Pages

on:
  push:
    branches: [publish]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx tailwindcss -i src/assets/css/tailwind-entry.css -o src/assets/css/tailwind.css --minify

      - name: Build SSG
        run: |
          export I18N_CACHE_TS=$(date +%s)
          export VERSION=$(date +%s000)
          bash build.sh

      - name: Generate SPA product routes
        run: node scripts/generate-spa-product-routes.js

      - name: Copy extra root files
        run: |
          cp CNAME dist/
          cp sw.js dist/
          touch dist/.nojekyll

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

      - name: Purge Cloudflare cache
        if: env.CF_ZONE != '' && env.CF_TOKEN != ''
        env:
          CF_ZONE: ${{ secrets.CF_ZONE }}
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/purge_cache" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"purge_everything":true}'
