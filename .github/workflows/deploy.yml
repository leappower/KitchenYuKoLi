name: Deploy to GitHub Pages

on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx tailwindcss -i src/assets/css/tailwind-entry.css -o src/assets/css/tailwind.css --minify

      - name: Build SSG
        run: bash build.sh

      - name: Generate SPA product routes
        run: node scripts/generate-spa-product-routes.js

      - name: Copy extra root files
        run: |
          cp CNAME dist/
          cp sw.js dist/
          touch dist/.nojekyll

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
