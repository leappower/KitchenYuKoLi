    var categorySlugs = ["cutting","stirfry","frying","stewing","steaming","other","all","compare"];
    // Only redirect /products/{category} (2 segments), not /products/{category}/{model}/ (3+ segments)
    if (/^\/products\/([^/]+)$/.test(path.replace(/\/$/, ""))) {
      var productFirstSegment = path.replace(/^\/products\//, "").replace(/\/$/, "");
      if (productFirstSegment && categorySlugs.indexOf(productFirstSegment) !== -1) {
        window.location.replace(base + "/?redirect=" + encodeURIComponent(path));
      }
    }
    var stripped = normalized.replace(/^\//, "");
    if (routes.indexOf(stripped) !== -1) {
      window.location.replace(base + "/" + stripped + "/");
    } else {
      var segment = normalized.split("/").pop();
      if (routes.indexOf(segment) !== -1) {
        window.location.replace(base + "/" + segment + "/");
      }
    }
  }());
  </script>

    <script>
    (function checkDevice(){
      if(window.__redirectChecked)return;
      if(window.__spaNavigating)return;
      window.__redirectChecked=true;
      var u=new URLSearchParams(location.search);
      var c=u.get("clean-url");
      if(c){
        history.replaceState({},"",c);
        return;
      }
      var f=location.pathname.split("/").pop();
      var dir=location.pathname.replace(/[^\/]*$/,"");
      // 设备版页面（有或无 .html 后缀）→ 不做任何操作
      if(f.match(/^index-(pc|mobile|tablet)(\.html)?$/))return;
      // 目录 URL → 跳到对应设备版本（不带 .html 后缀，避免 serve 301）
      function getTarget(){
        var mq=window.matchMedia;
        var isPc=mq("(min-width:1024px)").matches;
        var isTb=mq("(min-width:768px) and (max-width:1023px)").matches;
        var isMb=mq("(max-width:767px)").matches;
        if(mq&&mq("(pointer:coarse)").matches&&!isPc){isMb=true;isTb=false;}
        return isPc?"index-pc":isTb?"index-tablet":"index-mobile";
      }
      location.replace(dir+getTarget()+"?clean-url="+encodeURIComponent(dir));
    })();
    </script>
