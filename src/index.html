  <script>
  // Force unregister any stale Service Worker from previous versions
  if('serviceWorker' in navigator){
    navigator.serviceWorker.getRegistrations().then(function(regs){
      regs.forEach(function(r){r.unregister()});
    });
  }
  if('caches' in window){
    caches.keys().then(function(names){
      names.forEach(function(n){caches.delete(n)});
    });
  }
  </script>

<!-- Product data: static initial data → API refresh with ETag → localStorage cache -->
<script>
(function() {
  var KEY = 'pdt_v2';
  var VERSION_KEY = 'pdt_version';
  // Step 1: initial data from static file (always fresh after publish)
  var initial = window.PRODUCT_DATA_TABLE || [];
  var version = window.PRODUCT_DATA_VERSION || '0';
  // Step 1: load from static file (build-time export, always available)
  fetch('/assets/data/products.json')
    .then(function(r) {
      if (!r.ok) throw new Error('Static ' + r.status);
      return r.json();
    })
    .then(function(data) {
      if (data && data.length) {
        window.PRODUCT_DATA_TABLE = data;
        // Cache to localStorage
        try {
          localStorage.setItem(KEY, JSON.stringify(data));
          localStorage.setItem(VERSION_KEY, version);
        } catch(e) {}
      }
      window.dispatchEvent(new Event('product-data-ready'));
    })
    .catch(function() {
      // Step 2: fallback to localStorage cache
      var cached = null;
      try { cached = JSON.parse(localStorage.getItem(KEY)); } catch(e) {}
      window.PRODUCT_DATA_TABLE = cached || initial;
      // Step 3: async refresh from API
      fetch('/api/public/products-data?_t=' + Date.now())
        .then(function(r) {
          if (!r.ok) throw new Error('API ' + r.status);
          return r.json();
        })
        .then(function(data) {
          if (data && data.length) window.PRODUCT_DATA_TABLE = data;
          try {
            localStorage.setItem(KEY, JSON.stringify(data));
            localStorage.setItem(VERSION_KEY, version);
          } catch(e) {}
          window.dispatchEvent(new Event('product-data-updated'));
        })
        .catch(function() {});
      window.dispatchEvent(new Event('product-data-ready'));
    });
})();
</script>

<!-- Scripts -->
<script>
  (function() {
    // Wait for DOM to be ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initSPA);
    } else {
      initSPA();
    }

    function initSPA() {
      // Navigator and Footer are auto-mounted by their own boot() code.
      // Do NOT call mount() again — the placeholder has already been replaced
      // and a second mount would find no placeholder to render.

      // Root path redirect: / → /home/
      var path = window.location.pathname;
      if (path === '/' || path === '/index.html') {
        history.replaceState(null, '', '/home/');
      }

      // GitHub Pages 404 SPA redirect:
      // 404.html redirects unknown paths to /?redirect=/original/path/
      // We restore the path before the SPA router initializes so it
      // navigates to the correct route instead of home.
      var redirectParam = new URLSearchParams(window.location.search).get('redirect');
      if (redirectParam) {
        // Clean the URL back to the original path before router init
        history.replaceState(null, '', redirectParam);
      }


    }
  })();
</script>
