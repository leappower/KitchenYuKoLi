<script>
(function() {
  'use strict';

  var MAX_COMPARE = 3;
  var COMPARE_KEY = 'YUKOLI_COMPARE_ITEMS';
  var selected = (function() { try { var d = localStorage.getItem(COMPARE_KEY); return d ? JSON.parse(d) : []; } catch(e) { return []; } })();

  // ─── Utility ──────────────────────────────────────────────
  function esc(s) {
    if (!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function getImageUrl(p) {
    if (p.images && Array.isArray(p.images) && p.images.length > 0) {
      var primary = p.images.find(function(i){ return i.isPrimary; }) || p.images[0];
      if (primary && primary.filePath) return primary.filePath;
    }
    if (p.image) return p.image;
    if (p.imageUrl) return p.imageUrl;
    return '/assets/images/products/' + (p.model || 'default') + '.webp';
  }

  function getProductList() {
    var result = [];
    if (!Array.isArray(window.PRODUCT_DATA_TABLE)) return result;
    window.PRODUCT_DATA_TABLE.forEach(function(cat) {
      if (!cat.products || !Array.isArray(cat.products)) return;
      cat.products.forEach(function(p) {
        result.push(Object.assign({}, p, {
          _category: cat.category || cat.slug || '',
          _categoryName: cat.categoryName || cat.category || '',
          _imageUrl: getImageUrl(p)
        }));
      });
    });
    return result;
  }

  function getCategories() {
    if (!Array.isArray(window.PRODUCT_DATA_TABLE)) return [];
    return window.PRODUCT_DATA_TABLE.map(function(cat) {
      var name = cat.categoryName || cat.category;
      var translated = (typeof window.t === 'function') ? window.t(cat.category) : null;
      var label = (translated && translated !== cat.category) ? translated : name;
      return { key: cat.category || cat.slug, name: label };
    }).filter(function(c){ return c.key; });
  }

  // ─── Category Tabs ────────────────────────────────────────
  var activeCategory = 'all';

  function renderCategoryTabs() {
    var container = document.getElementById('compare-category-tabs');
    if (!container) return;
    var cats = getCategories();
    var html = '<button class="category-tab active px-4 py-2 text-sm font-bold whitespace-nowrap rounded-full border border-slate-200 dark:border-slate-700 bg-primary text-white border-primary" data-cat="all">全部产品</button>';
    cats.forEach(function(c) {
      html += '<button class="category-tab px-4 py-2 text-sm font-medium whitespace-nowrap rounded-full border border-slate-200 dark:border-slate-700 hover:border-primary hover:text-primary transition-all" data-cat="' + esc(c.key) + '">' + esc(c.name) + '</button>';
    });
    container.innerHTML = html;

    container.addEventListener('click', function(e) {
      var btn = e.target.closest('.category-tab');
      if (!btn) return;
      activeCategory = btn.dataset.cat;
      container.querySelectorAll('.category-tab').forEach(function(b) {
        b.classList.remove('active', 'bg-primary', 'text-white', 'border-primary');
      });
      btn.classList.add('active', 'bg-primary', 'text-white', 'border-primary');
      renderProductCards();
    });
  }

  // ─── Product Cards ────────────────────────────────────────
  function renderProductCards() {
    var grid = document.getElementById('compare-product-grid');
    if (!grid) return;
    var products = getProductList();
    if (activeCategory !== 'all') {
      products = products.filter(function(p) { return p._category === activeCategory; });
    }

    grid.innerHTML = products.map(function(p) {
      var model = esc(p.model || '');
      var name = esc(p.name || model);
      var img = esc(p._imageUrl);
      var isSelected = selected.some(function(s){ return s.model === p.model; });
      var specs = [];
      if (p.power) specs.push(esc(p.power));
      if (p.throughput) specs.push(esc(p.throughput));
      var specHTML = specs.slice(0,2).map(function(s) {
        return '<span class="px-2 py-0.5 bg-primary/10 text-primary text-xs font-medium rounded">' + s + '</span>';
      }).join('');

      return '<div class="compare-card bg-white dark:bg-slate-800 rounded-2xl border-2 ' + (isSelected ? 'border-primary shadow-lg shadow-primary/20 selected' : 'border-slate-200 dark:border-slate-700') + ' overflow-hidden relative" data-model="' + model + '">' +
        (isSelected ? '<div class="select-badge absolute top-3 right-3 w-7 h-7 bg-primary text-white rounded-full items-center justify-center z-10"><span class="material-symbols-outlined text-lg">check</span></div>' : '') +
        '<div class="aspect-[4/3] overflow-hidden bg-slate-100 dark:bg-slate-700">' +
          '<img loading="lazy" alt="' + name + '" class="w-full h-full object-cover" src="' + img + '" onerror="this.src=\'/assets/images/products/default.webp\'">' +
        '</div>' +
        '<div class="p-4">' +
          '<div class="flex items-center gap-1.5 mb-2"><span class="material-symbols-outlined text-primary text-sm">local_fire_department</span><span class="text-xs font-bold text-primary uppercase tracking-wider">' + esc(p.subCategory || p._categoryName) + '</span></div>' +
          '<h3 class="text-base font-bold mb-1 text-slate-900 dark:text-white truncate">' + name + '</h3>' +
          '<p class="text-xs text-slate-400 mb-3">' + esc(model) + '</p>' +
          (specHTML ? '<div class="flex flex-wrap gap-1.5 mb-3">' + specHTML + '</div>' : '') +
          '<button class="compare-toggle w-full py-2.5 rounded-xl text-sm font-bold transition-all ' +
            (isSelected ? 'bg-primary/10 text-primary border border-primary' : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-primary hover:text-white border border-transparent') +
            '">' +
            (isSelected ? '✓ 已选择' : '+ 加入对比') +
          '</button>' +
        '</div>' +
      '</div>';
    }).join('');

    // Bind clicks
    grid.querySelectorAll('.compare-card').forEach(function(card) {
      card.addEventListener('click', function() {
        var model = this.dataset.model;
        var products = getProductList();
        var product = products.find(function(p){ return p.model === model; });
        if (!product) return;
        toggleSelect(product);
      });
    });
  }

  // ─── Select / Deselect ────────────────────────────────────
  function saveToStorage() {
    try { localStorage.setItem(COMPARE_KEY, JSON.stringify(selected)); } catch(e) {}
  }

  function toggleSelect(product) {
    var idx = selected.findIndex(function(s){ return s.model === product.model; });
    if (idx >= 0) {
      selected.splice(idx, 1);
    } else {
      if (selected.length >= MAX_COMPARE) {
        showToast('最多只能选择 ' + MAX_COMPARE + ' 款产品进行对比');
        return;
      }
      selected.push(product);
    }
    saveToStorage();
    renderProductCards();
    renderCompareBar();
    renderComparisonTable();
    updateEmptyState();
  }

  function removeSelected(model) {
    selected = selected.filter(function(s){ return s.model !== model; });
    saveToStorage();
    renderProductCards();
    renderCompareBar();
    renderComparisonTable();
    updateEmptyState();
  }

  // ─── Compare Bar ──────────────────────────────────────────
  function renderCompareBar() {
    var bar = document.getElementById('compare-bar');
    var items = document.getElementById('compare-bar-items');
    var countEl = document.getElementById('compare-count');
    if (!bar || !items) return;

    if (selected.length === 0) {
      bar.classList.add('hidden');
      return;
    }
    bar.classList.remove('hidden');
    countEl.textContent = selected.length;

    items.innerHTML = selected.map(function(p) {
      var name = esc(p.name || p.model);
      var img = esc(p._imageUrl);
      return '<div class="flex items-center gap-2 bg-slate-50 dark:bg-slate-700 rounded-xl px-3 py-2 flex-shrink-0">' +
        '<img src="' + img + '" class="w-8 h-8 rounded-lg object-cover" onerror="this.src=\'/assets/images/products/default.webp\'">' +
        '<div class="min-w-0"><p class="text-sm font-bold text-slate-900 dark:text-white truncate max-w-[120px]">' + name + '</p></div>' +
        '<button class="remove-compare flex-shrink-0 text-slate-400 hover:text-red-500 transition-colors" data-model="' + esc(p.model) + '">' +
          '<span class="material-symbols-outlined text-base">close</span>' +
        '</button>' +
      '</div>';
    }).join('');

    items.querySelectorAll('.remove-compare').forEach(function(btn) {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        removeSelected(this.dataset.model);
      });
    });
  }

  // Clear all button
  var clearBtn = document.getElementById('compare-clear-btn');
  if (clearBtn) {
    clearBtn.addEventListener('click', function() {
      selected = [];
      try { localStorage.removeItem(COMPARE_KEY); } catch(e) {}
      renderProductCards();
      renderCompareBar();
      renderComparisonTable();
      updateEmptyState();
    });
  }

  // ─── Comparison Table ─────────────────────────────────────
  var COMPARE_ROWS = [
    { key: 'name', label: '产品名称', fn: function(p){ return p.name || p.model || '—'; } },
    { key: 'model', label: '型号', fn: function(p){ return p.model || '—'; } },
    { key: 'category', label: '产品分类', fn: function(p){ return p.subCategory || p._categoryName || '—'; } },
    { key: 'power', label: '功率', fn: function(p){ return p.power || '—'; } },
    { key: 'voltage', label: '电压', fn: function(p){ return p.voltage || '—'; } },
    { key: 'dimensions', label: '尺寸', fn: function(p){ return p.dimensions || '—'; } },
    { key: 'throughput', label: '产量/产能', fn: function(p){ return p.throughput || '—'; } },
    { key: 'averageTime', label: '平均加工时间', fn: function(p){ return p.averageTime || '—'; } },
    { key: 'weight', label: '净重', fn: function(p){ return p.weight || '—'; } },
    { key: 'tier', label: '等级', fn: function(p){ return p.tier || '—'; } },
    { key: 'highlights', label: '核心亮点', fn: function(p){ return p.highlights || p.description || '—'; } },
    { key: 'specifications', label: '规格参数', fn: function(p){
      if (!p.specifications) return '—';
      if (typeof p.specifications === 'string') return p.specifications;
      if (Array.isArray(p.specifications)) return p.specifications.join('、');
      return JSON.stringify(p.specifications);
    }}
  ];

  function renderComparisonTable() {
    var section = document.getElementById('comparison-section');
    var tableContainer = document.getElementById('comparison-table');
    if (!section || !tableContainer) return;

    if (selected.length < 2) {
      section.classList.add('hidden');
      return;
    }
    section.classList.remove('hidden');

    var colCount = selected.length;
    var colWidth = colCount === 2 ? 'w-1/2' : 'w-1/3';

    var headerHTML = '<table class="w-full min-w-[600px]">' +
      '<thead><tr>' +
        '<th class="text-left px-6 py-4 text-sm font-bold text-slate-500 dark:text-slate-400 bg-slate-50 dark:bg-slate-900/50 w-1/' + (colCount + 1) + ' min-w-[140px]">参数</th>';
    selected.forEach(function(p) {
      headerHTML += '<th class="px-4 py-4 ' + colWidth + ' text-center bg-slate-50 dark:bg-slate-900/50">' +
        '<div class="flex flex-col items-center gap-2">' +
          '<img src="' + esc(p._imageUrl) + '" class="w-16 h-16 rounded-xl object-cover" onerror="this.src=\'/assets/images/products/default.webp\'">' +
          '<p class="text-sm font-black text-slate-900 dark:text-white">' + esc(p.name || p.model) + '</p>' +
          '<p class="text-xs text-slate-400">' + esc(p.model) + '</p>' +
        '</div>' +
      '</th>';
    });
    headerHTML += '</tr></thead><tbody>';

    var bodyHTML = '';
    COMPARE_ROWS.forEach(function(row, ri) {
      var values = selected.map(function(p){ return String(row.fn(p)); });
      var allSame = values.every(function(v){ return v === values[0]; });
      var bgClass = ri % 2 === 0 ? '' : 'bg-slate-50/50 dark:bg-slate-800/50';

      bodyHTML += '<tr class="' + bgClass + ' border-t border-slate-100 dark:border-slate-700/50">' +
        '<td class="px-6 py-3 text-sm font-bold text-slate-700 dark:text-slate-300 whitespace-nowrap">' + row.label + '</td>';
      selected.forEach(function(p, pi) {
        var val = row.fn(p);
        var cellClass = '';
        if (!allSame) {
          cellClass = 'diff-highlight text-primary';
        }
        bodyHTML += '<td class="px-4 py-3 text-sm text-center ' + cellClass + '">' + esc(val) + '</td>';
      });
      bodyHTML += '</tr>';
    });

    tableContainer.innerHTML = headerHTML + bodyHTML + '</tbody></table>';
  }

  // ─── Empty State ──────────────────────────────────────────
  function updateEmptyState() {
    var empty = document.getElementById('compare-empty');
    if (!empty) return;
    if (selected.length >= 2) {
      empty.classList.add('hidden');
    } else {
      empty.classList.remove('hidden');
    }
  }

  // ─── Toast ────────────────────────────────────────────────
  function showToast(msg) {
    var toast = document.createElement('div');
    toast.className = 'fixed top-[130px] right-6 bg-slate-900 dark:bg-white text-white dark:text-slate-900 px-6 py-3 rounded-xl shadow-xl z-[100] text-sm font-medium transition-all duration-300';
    toast.style.opacity = '0';
    toast.style.transform = 'translateY(-10px)';
    toast.textContent = msg;
    document.body.appendChild(toast);
    requestAnimationFrame(function() {
      toast.style.opacity = '1';
      toast.style.transform = 'translateY(0)';
    });
    setTimeout(function() {
      toast.style.opacity = '0';
      toast.style.transform = 'translateY(-10px)';
      setTimeout(function(){ toast.remove(); }, 300);
    }, 2000);
  }

  // ─── Init ─────────────────────────────────────────────────
  function initCompare() {
    // If data not loaded yet, fetch it
    if (Array.isArray(window.PRODUCT_DATA_TABLE) && window.PRODUCT_DATA_TABLE.length > 0) {
      renderCategoryTabs();
      renderProductCards();
    } else {
      // Restore from localStorage cache (same key as index.html product-data-loader)
      try {
        var cached = JSON.parse(localStorage.getItem('pdt_v2'));
        if (Array.isArray(cached) && cached.length > 0) {
          window.PRODUCT_DATA_TABLE = cached;
          window.dispatchEvent(new Event('product-data-ready'));
          renderCategoryTabs();
          renderProductCards();
          return;
        }
      } catch(e) {}
      // Fallback: try API
      fetch('/api/cms/products-data', { cache: 'no-store' })
        .then(function(r){ return r.json(); })
        .then(function(data) {
          window.PRODUCT_DATA_TABLE = data;
          window.dispatchEvent(new Event('product-data-ready'));
          renderCategoryTabs();
          renderProductCards();
        })
        .catch(function(err) {
          console.error('[Compare] Failed to load product data:', err);
        });
    }
  }

  // Listen for storage events from other tabs (e.g. product listing page)
  window.addEventListener('storage', function(e) {
    if (e.key === COMPARE_KEY) {
      try { selected = e.newValue ? JSON.parse(e.newValue) : []; } catch(err) { selected = []; }
      renderProductCards();
      renderCompareBar();
      renderComparisonTable();
      updateEmptyState();
    }
  });

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initCompare);
  } else {
    initCompare();
  }

  document.addEventListener('spa:load', initCompare);
  window.addEventListener('product-data-ready', function() {
    renderCategoryTabs();
    renderProductCards();
  });
})();
</script>

    if (window.SpaRouter && typeof window.SpaRouter.init === 'function') {
      window.SpaRouter.init();
    }
  });
</script>
