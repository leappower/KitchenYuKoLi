    <script>
    (function checkDevice(){
      if(window.__redirectChecked){return;}
      if(document.querySelector("meta[name=ssg-device]")){return;}
      window.__redirectChecked=true;
      var u=new URLSearchParams(location.search);
      var c=u.get("clean-url");
      if(c){history.replaceState({},"",c);return}
      if(window.__spaNavigating){return;}
      var f=location.pathname.split("/").pop();
      var dir=location.pathname.replace(/[^\/]*$/,"");
      function getTarget(){
        var mq=window.matchMedia;
        var isPc=mq("(min-width:1024px)").matches;
        var isTb=mq("(min-width:768px) and (max-width:1023px)").matches;
        var isMb=mq("(max-width:767px)").matches;
        if(mq&&mq("(pointer:coarse)").matches&&!isPc){isMb=true;isTb=false;}
        return isPc?"index-pc.html":isTb?"index-tablet.html":"index-mobile.html";
      }
      var t=getTarget();
      if(!f||!f.match(/\.html$/)){
        // 目录 URL → replace 跳到对应设备版本（不留历史记录）
        location.replace(dir+t);
        return;
      }
      if(f.match(/^index-(pc|mobile|tablet)\.html$/)){
        // 已在设备版本 → replaceState 清理 URL，显示干净路径
        var clean=dir;
        if(location.pathname!==clean){history.replaceState({},"",clean);}
        return;
      }
    })();
    </script>
