  <!-- ═══ GH Pages 静态部署 SPA fallback ═══
       场景1: 访问 / → SPA Shell（spa-content 为空）→ 立刻同步跳转到设备版首页
       场景2: 访问 /?redirect=/products/ → 404 还原 → 如果 Swup 初始化失败，页面保持空白
       场景3: SPA Shell 中任何导致 Swup 不初始化的异常

       此脚本在 <head> 中同步执行（无 defer），在浏览器渲染 body 前完成跳转。
       即使后续脚本全部加载失败，用户也已经在新页面上了。
  -->
  <script>
    // ⚡ 同步检测：当前路径是否是 SPA Shell（只有根路径 / 和 /index.html 返回空 shell）
    (function(){
      var path = window.location.pathname;

      // 场景1: 根路径 → 跳到 /home/ 目录页
      // serve 对 .html 文件做 301 去后缀重定向，不能用 .html 后缀跳转。
      // /home/index.html 的 device-redirect 负责判断设备类型并跳转到设备版。
      // 跳转时带上 ?source=shell 参数，注明来自 SPA Shell。
      if (path === '/' || path === '/index.html') {
        window.location.replace('/home/');
        return;
      }

      // 场景2: redirect 参数（来自 404.html SPA 还原）
      var rp = new URLSearchParams(window.location.search).get('redirect');
      if (rp) {
        // 判断 redirect 目标是否在已知路由列表中
        var knownRoutes = ["about","applications","applications/canteen","applications/central-kitchen","applications/chain-restaurant","applications/cloud-kitchen","applications/food-factory","applications/menu-lab","applications/small-restaurant","cases","cases/bangkok","cases/cebu","cases/hanoi","cases/hcmc","cases/jakarta","cases/kl","cases/manila","cases/surabaya","contact","home","privacy","products","products/all","products/compare","products/cutting","products/detail","products/frying","products/other","products/steaming","products/stewing","products/stirfry","profit-calculator","quote","support","support/faq","support/installation","support/services","support/spare-parts","support/training","support/warranty","terms","thank-you"];
        var rpClean = rp.replace(/^\/+|\/+$/g, '');
        // 已知路由 → 跳到对应的 SSG 目录页面
        // 目录页本身就是 PC 版完整内容，device-redirect 不再跳转
        if (knownRoutes.indexOf(rpClean) !== -1) {
          window.location.replace('/' + rpClean + '/');
          return;
        }
        // 未知路由 → 跳到 products 页面
        if (/^products\/[^/]+$/.test(rpClean)) {
          window.location.replace('/products/');
          return;
        }
      }
    })();
  </script>

  <script>
  // Force unregister any stale Service Worker from previous versions
  if('serviceWorker' in navigator){
    navigator.serviceWorker.getRegistrations().then(function(regs){
      regs.forEach(function(r){r.unregister()});
    });
  }
  if('caches' in window){
    caches.keys().then(function(names){
      names.forEach(function(n){caches.delete(n)});
    });
  }
  </script>

<!-- Product data: static initial data → API refresh with ETag → localStorage cache -->
<script>
/**
 * 产品数据加载策略（v2 — 消除 category 污染）
 *
 * 数据来源（两个，按优先级）：
 *   1. product-data-table.js（SSG 注入的 <script>，硬编码）
 *      → 拥有正确的 category（"翻炒系列"/"切配系列"等）
 *      → 是分类映射（CATEGORY_NAME_TO_SLUG）的唯一基准
 *   2. products.json（build 时从 Server 导出的静态 JSON）
 *      → 拥有 product-data-table.js 没有的字段：relatedProducts、sort_order
 *      → category 值是 "台式"/"落地式"（不同分类维度，不适用于前端）
 *
 * 策略：
 *   以 product-data-table.js 为主表，products.json 为辅表。
 *   products.json 按 model 合并补充字段，但绝不覆盖：
 *     - category（保留主表的值）
 *     - name（保留主表的值）
 *     - images（保留主表的值）
 */
(function() {
  var KEY = 'pdt_v2';
  var VERSION_KEY = 'pdt_version';
  var initial = window.PRODUCT_DATA_TABLE || [];
  var version = window.PRODUCT_DATA_VERSION || '0';

  fetch('/assets/data/products.json')
    .then(function(r) {
      if (!r.ok) throw new Error('Static ' + r.status);
      return r.json();
    })
    .then(function(extra) {
      if (!extra || !extra.length) {
        window.dispatchEvent(new Event('product-data-ready'));
        return;
      }

      // 以 product-data-table.js 的硬编码数据为主表
      var base = window.PRODUCT_DATA_TABLE;
      if (!base || !base.length) {
        // 没有主表时直接用 products.json（但不保留错误 category）
        window.PRODUCT_DATA_TABLE = extra;
        cacheToLocal(extra);
        window.dispatchEvent(new Event('product-data-ready'));
        return;
      }

      // 按 model 建立 products.json 的索引
      var extraIndex = {};
      for (var ei = 0; ei < extra.length; ei++) {
        var ep = extra[ei];
        if (ep && ep.model) extraIndex[ep.model] = ep;
      }

      // 合并：保留主表字段，从辅表补充缺失字段
      var NEVER_OVERWRITE = { category: 1, name: 1, images: 1 };
      for (var bi = 0; bi < base.length; bi++) {
        var bp = base[bi];
        if (!bp || !bp.model) continue;
        var ep2 = extraIndex[bp.model];
        if (!ep2) continue;
        for (var ek in ep2) {
          if (ep2.hasOwnProperty && !ep2.hasOwnProperty(ek)) continue;
          // 绝不覆盖这些字段
          if (NEVER_OVERWRITE[ek]) continue;
          // 只有主表中该字段不存在或为 null/undefined/空字符串时才补充
          if (bp[ek] === undefined || bp[ek] === null || bp[ek] === '') {
            bp[ek] = ep2[ek];
          }
        }
      }

      // 缓存合并后的数据
      cacheToLocal(base);
      window.dispatchEvent(new Event('product-data-ready'));
    })
    .catch(function() {
      // products.json 加载失败：fallback 到主表或 localStorage
      var cached = null;
      try { cached = JSON.parse(localStorage.getItem(KEY)); } catch(e) {}
      var fallback = cached || window.PRODUCT_DATA_TABLE || initial;
      window.PRODUCT_DATA_TABLE = fallback;
      window.dispatchEvent(new Event('product-data-ready'));
    });

  function cacheToLocal(data) {
    try {
      localStorage.setItem(KEY, JSON.stringify(data));
      localStorage.setItem(VERSION_KEY, version);
    } catch(e) {}
  }
})();
</script>

<!-- Scripts -->
<script>
  (function() {
    // Wait for DOM to be ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initSPA);
    } else {
      initSPA();
    }

    function initSPA() {
      // Navigator and Footer are auto-mounted by their own boot() code.
      // Do NOT call mount() again — the placeholder has already been replaced
      // and a second mount would find no placeholder to render.

      // 根路径跳转：已在 <head> 同步脚本中处理，此处为兜底（针对 DOMContentLoaded
      // 触发时的 defer 脚本环境，head 同步跳转可能已阻止了此页面的继续渲染）
      // 但为保险保留检查，防止极端情况下 head 脚本未执行跳转
      var path = window.location.pathname;
      if (path === '/' || path === '/index.html') {
        return; // 如果还能执行到这里说明 head 脚本已失败，放弃 SPA 初始化
      }

      // GitHub Pages 404 SPA redirect:
      // 404.html redirects unknown paths to /?redirect=/original/path/
      // We restore the path before the SPA router initializes so it
      // navigates to the correct route instead of home.
      var redirectParam = new URLSearchParams(window.location.search).get('redirect');
      if (redirectParam) {
        // redirect 已在 head 同步脚本中处理跳转到 SSG 页面
        // 如果还能执行到此处，说明 head 脚本决定走 SPA 路由，保留恢复逻辑
        history.replaceState(null, '', redirectParam);
      }

      // Anti-FOUC: reveal body once DOM + skeleton are ready
      // SPA router will add yukoli-ready on content:replace;
      // this fallback covers non-SPA pages and slow loads
      setTimeout(function () {
        document.body.classList.add('yukoli-ready');
      }, 600);
    }
  })();
</script>

  <!-- ═══ SPA 初始化超时 fallback ═══
       如果 SPA 路由初始化失败（Swup 未加载、脚本报错等），
       spa-content 将保持为空（骨架屏可见但无实际内容）。
       此脚本检测超时后：
       1. 仍然在 / (SPA Shell) → 整页跳转到 /home/（设备版由 device-redirect 处理）
       2. 已切换到其他路径（?redirect=）但 spa-content 仍为空 → fallback 到整页跳转
  -->
  <script>
    (function(){
      var SPA_TIMEOUT = 5000; // 5 秒后检测 SPA 是否初始化成功
      var tid = setTimeout(function(){
        var spaContent = document.getElementById('spa-content');
        if (!spaContent) return;
        // 检查 spa-content 是否有子元素（Swup 填充内容后至少有一个元素）
        if (spaContent.children.length === 0) {
          // 还在 / 或 redirect 场景 → 整页跳转到对应 SSG 页面
          var path = window.location.pathname;
          var fallbackTarget = '/home/';
          // 根据当前路径尝试匹配已知路由
          var m = path.match(/^\/([a-z][a-z-]+)\/$/);
          if (m) {
            var pages = ["about","applications","cases","contact","home","privacy","products","profit-calculator","quote","support","terms","thank-you"];
            if (pages.indexOf(m[1]) !== -1) {
              fallbackTarget = '/' + m[1] + '/';
            }
          }
          window.location.replace(fallbackTarget);
        }
      }, SPA_TIMEOUT);

      // 如果 Swup 成功初始化，取消超时检测
      var checkSwup = function(){
        if (window.swupInstance) {
          clearTimeout(tid);
        } else {
          setTimeout(checkSwup, 500);
        }
      };
      setTimeout(checkSwup, 1000);
    })();
  </script>
