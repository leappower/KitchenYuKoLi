# lefthook.yml — KitchenYuKoLi Git Hooks
# Install: npx lefthook install
# Run manually: npx lefthook run pre-commit

pre-commit:
  parallel: true
  commands:
    lint-js:
      glob: "src/assets/js/**/*.js"
      run: npx eslint {staged_files}
    build-ssg-regex:
      glob: "scripts/build-ssg.js"
      run: node scripts/lint-build-ssg-regex.js
    lint-css:
      glob: "src/assets/css/**/*.css"
      run: npx stylelint {staged_files} --ignore-pattern "tailwind.css" --ignore-pattern "tailwind-entry.css"
    lint-html:
      glob: "src/**/*.html"
      run: npx htmlhint {staged_files}
    no-debug:
      glob: "src/**/*.{js,html}"
      run: |
        # awk-based parser: correctly handles colons in content (fixes :// bug)
        # Skips console.log/debug/table inside <script>...</script> blocks in HTML
        # (inline scripts like device-redirect intentionally use console.log)
        hits=$(grep -nE 'console\.(log|debug|table)\s*\(' {staged_files} 2>/dev/null | grep -v '^\s*//' || true)
        if [ -n "$hits" ]; then
          blocked=$(echo "$hits" | awk -F: 'NF >= 3 {
            file = $1
            # Skip .html files — they have intentional inline <script> console.log
            if (file ~ /\.html$/) next
            lnum = $2
            rest = $0; p = index(rest, $2)
            cur_line = substr(rest, p + length($2) + 2)
            if (cur_line ~ /__DEVELOPMENT__/) next
            if (lnum > 1) {
              cmd = "sed -n \"" lnum-1 "p\" \"" file "\""
              cmd | getline prev_line; close(cmd)
              if (prev_line ~ /__DEVELOPMENT__/) next
            }
            print $0
          }')
          if [ -n "$blocked" ]; then
            echo "$blocked"
            echo "❌ 发现 console.log/debug/table 残留！请清理后再提交。"
            exit 1
          fi
        fi
    no-debug-markers:
      glob: "src/**/*.{js,html}"
      run: |
        if grep -nE '(debug[-_](marker|log|diag)|DIAGNOSTIC|<!-- DEBUG)' {staged_files} 2>/dev/null; then
          echo "❌ 发现 debug marker 残留！请移除后再提交。"
          exit 1
        fi
    prettier-check:
      glob: "src/**/*.{js,css,json}"
      run: npx prettier --check {staged_files}
    empty-script-check:
      glob: "src/**/*.html"
      run: |
        if grep -n '<script[^>]*>\s*</script>' {staged_files} 2>/dev/null | grep -v 'src=' | grep -v 'type='; then
          echo "❌ 发现无 src/type 的空 <script> 标签！请移除。"
          exit 1
        fi
    i18n-keys:
      glob: "src/**/*.{js,html}"
      run: node scripts/lint-i18n-keys.js {staged_files}
    no-git-conflict-markers:
      glob: "src/**/*"
      run: |
        found=0
        for f in {staged_files}; do
          if grep -qE '<<<<<<< |^=======$|>>>>>>> ' "$f" 2>/dev/null; then
            echo "❌ Git conflict markers found in: $f"
            grep -nE '<<<<<<< |^=======$|>>>>>>> ' "$f" 2>/dev/null | head -5
            found=1
          fi
        done
        if [ "$found" -ne 0 ]; then
          echo "请解决 git 冲突后再提交。"
          exit 1
        fi

pre-push:
  commands:
    test:
      run: npx jest tests/unit/ --silent --passWithNoTests --maxWorkers=2
    build-smoke:
      run: bash scripts/pre-push-check.sh
